<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Monetag Domain Verification Tag -->
    <meta name="monetag" content="70d3e56bae865ff3e63045b758949de9">
    <title>Pong Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Top Space Container */
        .top-spacer {
            width: 100%;
            max-width: 400px;
            height: 20px;
        }

        /* Game Card Container */
        .game-container {
            width: 100%;
            max-width: 400px;
            background-color: #1e293b;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        .trophy-btn {
            background: #334155;
            border: none;
            color: #fbbf24;
            font-size: 1.2rem;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .trophy-btn:active {
            transform: scale(0.95);
        }

        /* Controls / Difficulty */
        .controls {
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 8px 0;
            background-color: #334155;
            color: #94a3b8;
            border: 2px solid transparent;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn.active {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
        }

        /* Scoreboard */
        .scoreboard {
            width: 100%;
            display: flex;
            justify-content: space-around;
            background-color: #0f172a;
            padding: 8px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .score-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-label {
            font-size: 0.7rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        /* Game Canvas */
        canvas {
            background-color: #020617;
            border: 2px solid #334155;
            border-radius: 8px;
            width: 100%;
            height: auto;
            touch-action: none;
        }

        /* Footer Attribution */
        footer {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: auto;
            padding-bottom: 12px;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 350px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .ach-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }

        .ach-icon {
            font-size: 1.5rem;
            opacity: 0.3;
        }

        .ach-item.unlocked .ach-icon {
            opacity: 1;
        }

        .ach-info h4 {
            margin: 0;
            font-size: 0.9rem;
            color: #f8fafc;
        }

        .ach-info p {
            margin: 2px 0 0 0;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="top-spacer"></div>

    <!-- Main Game Container -->
    <div class="game-container">
        <div class="header">
            <h1>PONG</h1>
            <button class="trophy-btn" id="trophyBtn">🏆 <span id="achCount">0/7</span></button>
        </div>

        <div class="controls">
            <button class="btn active" onclick="setDifficulty('easy')">Easy</button>
            <button class="btn" onclick="setDifficulty('medium')">Medium</button>
            <button class="btn" onclick="setDifficulty('hard')">Hard</button>
        </div>

        <div class="scoreboard">
            <div class="score-box">
                <span class="score-label">Player</span>
                <span id="playerScore">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">Streak</span>
                <span id="streakScore">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">CPU</span>
                <span id="cpuScore">0</span>
            </div>
        </div>

        <canvas id="pongCanvas" width="360" height="480"></canvas>
    </div>

    <!-- Trophy Modal -->
    <div class="modal" id="trophyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin:0; color:#fbbf24;">Achievements</h3>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <div id="achievementList"></div>
        </div>
    </div>

    <footer>Created by Jack Vaughan</footer>

    <script>
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');

        // Audio Effects (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, duration) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // Achievements Configuration
        const achievementsData = [
            { id: 'first_win', name: 'First Victory', desc: 'Win your first Pong match', icon: '🥇' },
            { id: 'streak_3', name: 'Hot Streak', desc: 'Win 3 games in a row', icon: '🔥' },
            { id: 'streak_5', name: 'Unstoppable', desc: 'Win 5 games in a row', icon: '🌋' },
            { id: 'hard_win', name: 'Pro Player', desc: 'Win a match on Hard difficulty', icon: '👑' },
            { id: 'superhit', name: 'Power Hitter', desc: 'Trigger a Superhit shot', icon: '⚡' },
            { id: 'shutout', name: 'Flawless Victory', desc: 'Win a match without CPU scoring', icon: '🛡️' },
            { id: 'master', name: 'Pong Master', desc: 'Unlock all other achievements', icon: '💎' }
        ];

        let unlockedAchievements = JSON.parse(localStorage.getItem('pong_achievements')) || {};
        let winStreak = parseInt(localStorage.getItem('pong_streak')) || 0;

        function saveAchievements() {
            localStorage.setItem('pong_achievements', JSON.stringify(unlockedAchievements));
            localStorage.setItem('pong_streak', winStreak.toString());
            updateTrophyCount();
        }

        function unlockAchievement(id) {
            if (!unlockedAchievements[id]) {
                unlockedAchievements[id] = true;
                playSound(600, 0.3);
                saveAchievements();
                checkMasterAchievement();
            }
        }

        function checkMasterAchievement() {
            const keys = achievementsData.map(a => a.id).filter(id => id !== 'master');
            if (keys.every(key => unlockedAchievements[key])) {
                unlockAchievement('master');
            }
        }

        function updateTrophyCount() {
            const count = Object.keys(unlockedAchievements).length;
            document.getElementById('achCount').innerText = `${count}/${achievementsData.length}`;
            document.getElementById('streakScore').innerText = winStreak;
        }

        // Game State
        let difficulty = 'easy';
        let playerScore = 0;
        let cpuScore = 0;
        const targetScore = 5;

        const paddleWidth = 70;
        const paddleHeight = 10;

        const player = { x: canvas.width / 2 - paddleWidth / 2, y: canvas.height - 20, width: paddleWidth, height: paddleHeight };
        const cpu = { x: canvas.width / 2 - paddleWidth / 2, y: 10, width: paddleWidth, height: paddleHeight, speed: 3 };
        const ball = { x: canvas.width / 2, y: canvas.height / 2, radius: 6, dx: 3, dy: 3, speed: 4 };

        const diffSettings = {
            easy: { cpuSpeed: 2.5, ballSpeed: 4 },
            medium: { cpuSpeed: 3.8, ballSpeed: 5 },
            hard: { cpuSpeed: 5.2, ballSpeed: 6.5 }
        };

        function setDifficulty(diff) {
            difficulty = diff;
            document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            resetBall();
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            const speed = diffSettings[difficulty].ballSpeed;
            ball.dy = Math.random() > 0.5 ? speed : -speed;
            ball.dx = (Math.random() - 0.5) * speed;
            ball.speed = speed;
        }

        // Controls
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            player.x = touchX - player.width / 2;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
        }, { passive: false });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left - player.width / 2;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
        });

        function update() {
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Bounce off walls
            if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                ball.dx *= -1;
                playSound(200, 0.05);
            }

            // AI movement
            const cpuSpeed = diffSettings[difficulty].cpuSpeed;
            if (cpu.x + cpu.width / 2 < ball.x - 10) {
                cpu.x += cpuSpeed;
            } else if (cpu.x + cpu.width / 2 > ball.x + 10) {
                cpu.x -= cpuSpeed;
            }

            // Paddle collisions
            if (ball.y + ball.radius >= player.y && 
                ball.x >= player.x && ball.x <= player.x + player.width) {
                
                let hitPos = (ball.x - (player.x + player.width / 2)) / (player.width / 2);
                ball.dy = -Math.abs(ball.dy);
                ball.dx = hitPos * ball.speed * 1.2;

                if (Math.abs(hitPos) > 0.7) {
                    ball.dx *= 1.3;
                    unlockAchievement('superhit');
                    playSound(450, 0.15);
                } else {
                    playSound(300, 0.08);
                }
            }

            if (ball.y - ball.radius <= cpu.y + cpu.height && 
                ball.x >= cpu.x && ball.x <= cpu.x + cpu.width) {
                ball.dy = Math.abs(ball.dy);
                playSound(300, 0.08);
            }

            // Scoring
            if (ball.y < 0) {
                playerScore++;
                document.getElementById('playerScore').innerText = playerScore;
                playSound(500, 0.2);
                checkMatchEnd();
                resetBall();
            } else if (ball.y > canvas.height) {
                cpuScore++;
                document.getElementById('cpuScore').innerText = cpuScore;
                playSound(150, 0.2);
                checkMatchEnd();
                resetBall();
            }
        }

        function checkMatchEnd() {
            if (playerScore >= targetScore) {
                unlockAchievement('first_win');
                winStreak++;
                if (winStreak >= 3) unlockAchievement('streak_3');
                if (winStreak >= 5) unlockAchievement('streak_5');
                if (difficulty === 'hard') unlockAchievement('hard_win');
                if (cpuScore === 0) unlockAchievement('shutout');

                saveAchievements();
                alert('You Won!');
                resetGame();
            } else if (cpuScore >= targetScore) {
                winStreak = 0;
                saveAchievements();
                alert('CPU Won!');
                resetGame();
            }
        }

        function resetGame() {
            playerScore = 0;
            cpuScore = 0;
            document.getElementById('playerScore').innerText = '0';
            document.getElementById('cpuScore').innerText = '0';
            resetBall();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.setLineDash([6, 6]);
            ctx.strokeStyle = '#334155';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            ctx.fillStyle = '#f43f5e';
            ctx.fillRect(cpu.x, cpu.y, cpu.width, cpu.height);

            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        const trophyBtn = document.getElementById('trophyBtn');
        const trophyModal = document.getElementById('trophyModal');
        const closeModal = document.getElementById('closeModal');
        const achievementList = document.getElementById('achievementList');

        trophyBtn.addEventListener('click', () => {
            achievementList.innerHTML = '';
            achievementsData.forEach(ach => {
                const unlocked = unlockedAchievements[ach.id];
                const item = document.createElement('div');
                item.className = `ach-item ${unlocked ? 'unlocked' : ''}`;
                item.innerHTML = `
                    <div class="ach-icon">${ach.icon}</div>
                    <div class="ach-info">
                        <h4>${ach.name} ${unlocked ? '✓' : ''}</h4>
                        <p>${ach.desc}</p>
                    </div>
                `;
                achievementList.appendChild(item);
            });
            trophyModal.style.display = 'flex';
        });

        closeModal.addEventListener('click', () => trophyModal.style.display = 'none');
        window.addEventListener('click', (e) => { if (e.target === trophyModal) trophyModal.style.display = 'none'; });

        updateTrophyCount();
        resetBall();
        loop();
    </script>
</body>
</html>
