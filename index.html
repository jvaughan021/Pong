<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Arcade Pong</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-blue: #2f81f7;
            --accent-gold: #d29922;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 12px;
            overflow: hidden;
        }

        header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title-group h1 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .diff-selector {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 8px;
        }

        .diff-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }

        .diff-btn.active {
            background: var(--accent-blue);
            color: #fff;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 8px;
            text-align: center;
        }

        .score-box {
            display: flex;
            flex-direction: column;
        }

        .score-label {
            font-size: 0.7rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .score-val {
            font-size: 1.4rem;
            font-weight: 800;
            color: #238636;
        }

        .score-val.bot {
            color: #da3633;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            background: #010409;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            height: 100%;
            max-height: 480px;
            touch-action: none;
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 17, 23, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 10;
        }

        .modal-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .modal-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .primary-btn {
            background: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            width: 80%;
        }

        .drawer {
            position: fixed;
            bottom: -100%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            border-radius: 16px 16px 0 0;
            padding: 16px;
            max-height: 70vh;
            overflow-y: auto;
            transition: bottom 0.3s ease;
            z-index: 20;
        }

        .drawer.open {
            bottom: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .ach-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            opacity: 0.4;
        }

        .ach-item.unlocked {
            opacity: 1;
            border-color: var(--accent-gold);
        }

        .ach-icon {
            font-size: 1.5rem;
        }

        .ach-info h4 {
            font-size: 0.9rem;
        }

        .ach-info p {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .footer-note {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 6px;
            text-align: center;
        }

        .toast {
            position: fixed;
            top: 20px;
            background: var(--accent-gold);
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            transform: translateY(-100px);
            transition: transform 0.3s ease;
            z-index: 30;
        }

        .toast.show {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <header>
        <div class="title-group">
            <span>🏓</span>
            <h1>Arcade Pong</h1>
        </div>
        <button class="icon-btn" onclick="toggleAchievements()">🏆 Trophies</button>
    </header>

    <div class="diff-selector">
        <button class="diff-btn" id="btn-easy" onclick="setDifficulty('easy')">Easy</button>
        <button class="diff-btn active" id="btn-medium" onclick="setDifficulty('medium')">Medium</button>
        <button class="diff-btn" id="btn-hard" onclick="setDifficulty('hard')">Hard</button>
    </div>

    <div class="scoreboard">
        <div class="score-box">
            <span class="score-label">You</span>
            <span class="score-val" id="playerScore">0</span>
        </div>
        <div class="score-box">
            <span class="score-label">Bot</span>
            <span class="score-val bot" id="botScore">0</span>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="pongCanvas"></canvas>

        <div class="modal-overlay" id="gameModal"></div>
    </div>

    <div class="footer-note" id="instructionText">Hit paddle edge for Superhit! • Tap to start</div>
    <div class="footer-note" style="margin-top:2px;">Created by Jack Vaughan</div>

    <div class="drawer" id="achDrawer">
        <div class="drawer-header">
            <h3>Achievements</h3>
            <button class="icon-btn" onclick="toggleAchievements()">Close</button>
        </div>
        <div id="achList"></div>
    </div>

    <div class="toast" id="toast">Achievement Unlocked!</div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        let AdController = null;
        if (window.Adsgram) {
            AdController = window.Adsgram.init({ blockId: "int-53213" });
        }

        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = Math.min(rect.height, 480);
        }
        resizeCanvas();

        const PADDLE_WIDTH = 70;
        const PADDLE_HEIGHT = 10;
        const BALL_RADIUS = 6;
        const WINNING_SCORE = 7;

        let currentDiff = 'medium';
        let isRunning = false;
        let isSuperhit = false;
        let countdownInterval = null;

        let player = { x: canvas.width / 2 - PADDLE_WIDTH / 2, y: canvas.height - 20, score: 0 };
        let bot = { x: canvas.width / 2 - PADDLE_WIDTH / 2, y: 10, score: 0 };
        let ball = { x: canvas.width / 2, y: canvas.height / 2, vx: 0, vy: 0, speed: 4 };

        const diffSettings = {
            easy: { botSpeed: 2.2, speedInc: 0.2 },
            medium: { botSpeed: 3.5, speedInc: 0.35 },
            hard: { botSpeed: 4.8, speedInc: 0.5 }
        };

        const achievementsData = [
            { id: 'firstWin', icon: '🥉', title: 'First Victory', desc: 'Win your first match.' },
            { id: 'winStreak2', icon: '🥈', title: 'On a Roll', desc: 'Win 2 matches in a row.' },
            { id: 'easyShutout', icon: '🧹', title: 'Easy Sweep', desc: 'Beat Easy bot 7-0.' },
            { id: 'medShutout', icon: '⚡', title: 'Medium Dominance', desc: 'Beat Medium bot 7-0.' },
            { id: 'hardShutout', icon: '🔥', title: 'Unstoppable', desc: 'Beat Hard bot 7-0.' },
            { id: 'medStreak2', icon: '🥇', title: 'Master Player', desc: 'Win 2 Medium matches in a row.' },
            { id: 'legend', icon: '👑', title: 'Pong Legend', desc: 'Win 3 Hard matches in a row.' },
            { id: 'superhit', icon: '💥', title: 'Superhit!', desc: 'Trigger a edge-boost hit.' }
        ];

        let unlockedAchievements = JSON.parse(localStorage.getItem('pong_achievements') || '[]');
        let winStreak = parseInt(localStorage.getItem('pong_streak') || '0');
        let medWinStreak = parseInt(localStorage.getItem('pong_med_streak') || '0');
        let hardWinStreak = parseInt(localStorage.getItem('pong_hard_streak') || '0');

        function unlockAchievement(id) {
            if (!unlockedAchievements.includes(id)) {
                unlockedAchievements.push(id);
                localStorage.setItem('pong_achievements', JSON.stringify(unlockedAchievements));
                const ach = achievementsData.find(a => a.id === id);
                showToast(`Unlocked: ${ach.title}`);
                renderAchievements();
            }
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function resetBall(servingPlayer = 'player') {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = 4;
            isSuperhit = false;
            const dir = servingPlayer === 'player' ? -1 : 1;
            const angle = (Math.random() * 0.8 - 0.4);
            ball.vx = ball.speed * Math.sin(angle);
            ball.vy = ball.speed * Math.cos(angle) * dir;
        }

        function update() {
            if (!isRunning) return;

            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.x - BALL_RADIUS <= 0 || ball.x + BALL_RADIUS >= canvas.width) {
                ball.vx *= -1;
            }

            const botTarget = ball.x - PADDLE_WIDTH / 2;
            const speed = diffSettings[currentDiff].botSpeed;
            if (bot.x < botTarget) bot.x = Math.min(bot.x + speed, botTarget);
            if (bot.x > botTarget) bot.x = Math.max(bot.x - speed, botTarget);
            bot.x = Math.max(0, Math.min(canvas.width - PADDLE_WIDTH, bot.x));

            if (ball.vy > 0 && ball.y + BALL_RADIUS >= player.y && ball.y - BALL_RADIUS <= player.y + PADDLE_HEIGHT) {
                if (ball.x >= player.x && ball.x <= player.x + PADDLE_WIDTH) {
                    let hitPos = (ball.x - (player.x + PADDLE_WIDTH / 2)) / (PADDLE_WIDTH / 2);
                    if (Math.abs(hitPos) > 0.75) {
                        isSuperhit = true;
                        ball.speed += 2.5;
                        unlockAchievement('superhit');
                    } else {
                        isSuperhit = false;
                        ball.speed += diffSettings[currentDiff].speedInc;
                    }
                    let angle = hitPos * (Math.PI / 3);
                    ball.vx = ball.speed * Math.sin(angle);
                    ball.vy = -ball.speed * Math.cos(angle);
                }
            }

            if (ball.vy < 0 && ball.y - BALL_RADIUS <= bot.y + PADDLE_HEIGHT && ball.y + BALL_RADIUS >= bot.y) {
                if (ball.x >= bot.x && ball.x <= bot.x + PADDLE_WIDTH) {
                    let hitPos = (ball.x - (bot.x + PADDLE_WIDTH / 2)) / (PADDLE_WIDTH / 2);
                    let angle = hitPos * (Math.PI / 3);
                    ball.speed += diffSettings[currentDiff].speedInc;
                    ball.vx = ball.speed * Math.sin(angle);
                    ball.vy = ball.speed * Math.cos(angle);
                }
            }

            if (ball.y < 0) {
                player.score++;
                document.getElementById('playerScore').textContent = player.score;
                if (player.score >= WINNING_SCORE) endGame(true);
                else resetBall('bot');
            } else if (ball.y > canvas.height) {
                bot.score++;
                document.getElementById('botScore').textContent = bot.score;
                if (bot.score >= WINNING_SCORE) endGame(false);
                else resetBall('player');
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = '#30363d';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#238636';
            ctx.fillRect(player.x, player.y, PADDLE_WIDTH, PADDLE_HEIGHT);

            ctx.fillStyle = '#da3633';
            ctx.fillRect(bot.x, bot.y, PADDLE_WIDTH, PADDLE_HEIGHT);

            ctx.fillStyle = isSuperhit ? '#d29922' : '#f0f6fc';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fill();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function setDifficulty(diff) {
            currentDiff = diff;
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${diff}`).classList.add('active');
        }

        function startCountdown(servingPlayer = 'player') {
            isRunning = false;
            if (countdownInterval) clearInterval(countdownInterval);

            const modal = document.getElementById('gameModal');
            let count = 3;
            modal.innerHTML = `<div class="modal-title">${count}</div>`;
            modal.classList.add('visible');

            countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    modal.innerHTML = `<div class="modal-title">${count}</div>`;
                } else {
                    clearInterval(countdownInterval);
                    modal.classList.remove('visible');
                    resetBall(servingPlayer);
                    isRunning = true;
                }
            }, 600);
        }

        function resetMatch() {
            player.score = 0;
            bot.score = 0;
            document.getElementById('playerScore').textContent = '0';
            document.getElementById('botScore').textContent = '0';
            player.x = canvas.width / 2 - PADDLE_WIDTH / 2;
            bot.x = canvas.width / 2 - PADDLE_WIDTH / 2;
            startCountdown('player');
        }

        function endGame(playerWon) {
            isRunning = false;
            if (countdownInterval) clearInterval(countdownInterval);

            if (playerWon) {
                showWinModal();
            } else {
                if (AdController) {
                    AdController.show().then(() => {
                        showLossModal();
                    }).catch(() => {
                        showLossModal();
                    });
                } else {
                    showLossModal();
                }
            }
        }

        function showWinModal() {
            const modal = document.getElementById('gameModal');
            modal.innerHTML = `
                <div class="modal-icon">🏆</div>
                <div class="modal-title">You Won the Match!</div>
                <button class="primary-btn" onclick="resetMatch()">Play Again</button>
            `;
            modal.classList.add('visible');

            unlockAchievement('firstWin');
            winStreak++;
            localStorage.setItem('pong_streak', winStreak);
            if (winStreak >= 2) unlockAchievement('winStreak2');

            if (bot.score === 0) {
                if (currentDiff === 'easy') unlockAchievement('easyShutout');
                if (currentDiff === 'medium') unlockAchievement('medShutout');
                if (currentDiff === 'hard') unlockAchievement('hardShutout');
            }

            if (currentDiff === 'medium') {
                medWinStreak++;
                localStorage.setItem('pong_med_streak', medWinStreak);
                if (medWinStreak >= 2) unlockAchievement('medStreak2');
            } else {
                medWinStreak = 0;
                localStorage.setItem('pong_med_streak', 0);
            }

            if (currentDiff === 'hard') {
                hardWinStreak++;
                localStorage.setItem('pong_hard_streak', hardWinStreak);
                if (hardWinStreak >= 3) unlockAchievement('legend');
            } else {
                hardWinStreak = 0;
                localStorage.setItem('pong_hard_streak', 0);
            }
        }

        function showLossModal() {
            const modal = document.getElementById('gameModal');
            modal.innerHTML = `
                <div class="modal-icon">💀</div>
                <div class="modal-title">Bot Wins!</div>
                <button class="primary-btn" onclick="resetMatch()">Play Again</button>
            `;
            modal.classList.add('visible');

            winStreak = 0;
            medWinStreak = 0;
            hardWinStreak = 0;
            localStorage.setItem('pong_streak', 0);
            localStorage.setItem('pong_med_streak', 0);
            localStorage.setItem('pong_hard_streak', 0);
        }

        function movePaddle(clientX) {
            const rect = canvas.getBoundingClientRect();
            let newX = clientX - rect.left - PADDLE_WIDTH / 2;
            player.x = Math.max(0, Math.min(canvas.width - PADDLE_WIDTH, newX));
        }

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            movePaddle(e.touches[0].clientX);
        }, { passive: false });

        canvas.addEventListener('mousemove', (e) => {
            movePaddle(e.clientX);
        });

        // Initial Title Screen
        const modal = document.getElementById('gameModal');
        modal.innerHTML = `
            <div class="modal-icon">🏓</div>
            <div class="modal-title">Arcade Pong</div>
            <button class="primary-btn" onclick="resetMatch()">Start Game</button>
        `;
        modal.classList.add('visible');

        function renderAchievements() {
            const list = document.getElementById('achList');
            list.innerHTML = achievementsData.map(a => `
                <div class="ach-item ${unlockedAchievements.includes(a.id) ? 'unlocked' : ''}">
                    <div class="ach-icon">${a.icon}</div>
                    <div class="ach-info">
                        <h4>${a.title}</h4>
                        <p>${a.desc}</p>
                    </div>
                </div>
            `).join('');
        }

        function toggleAchievements() {
            document.getElementById('achDrawer').classList.toggle('open');
        }

        renderAchievements();
        loop();
    </script>
</body>
</html>
